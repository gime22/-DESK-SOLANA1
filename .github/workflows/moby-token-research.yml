name: DESK Moby Token Research
on:
  workflow_dispatch:
    inputs:
      token_mint:
        description: Solana token mint to research (no trading)
        required: true
        type: string
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOBY_MCP_URL: ${{ secrets.MOBY_MCP_URL }}
      DESK_TOKEN_MINT: ${{ inputs.token_mint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python moby_token_research.py
