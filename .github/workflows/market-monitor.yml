name: DESK read-only market monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile scanner.py desk.py
      - name: Fetch market snapshot (no wallet, no trade)
        env:
          DESK_TOKEN_ADDRESS: ${{ vars.DESK_TOKEN_ADDRESS }}
        run: python scanner.py
