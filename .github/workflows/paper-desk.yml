name: DESK Paper Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -v
      - name: Paper simulation with synthetic inputs
        run: python paper_demo.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: desk-paper-demo
          path: reports/paper-demo.json
          retention-days: 7
