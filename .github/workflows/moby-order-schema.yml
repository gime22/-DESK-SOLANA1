name: DESK Moby Order Schema Inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/moby-order-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MOBY_MCP_URL: ${{ secrets.MOBY_MCP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Moby order parameter names only; no trades
        run: python moby_order_schema.py
