name: DESK Moby Read-Only Account Check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/moby-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MOBY_MCP_URL: ${{ secrets.MOBY_MCP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Moby read-only functions
        run: python moby_readonly.py
