name: DESK paper scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python desk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-paper-report
          path: reports/latest.json
          if-no-files-found: ignore
